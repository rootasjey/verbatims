<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200"><rect width="1600" height="1200" fill="#d1d0c5"/><text x="76" y="66" font-family="Georgia" font-size="26" font-style="italic" font-weight="600" fill="#1d201b">verbatims</text><text x="1524" y="64" text-anchor="end" font-family="Arial" font-size="14" fill="#57594f">11 November 2026 · priority 2</text><text x="76" y="139" font-family="Georgia" font-size="48" fill="#1d201b">Memory, Peace &amp; Reconciliation</text><rect x="76" y="177" width="650" height="880" rx="10" fill="#aaa79a"/><image href="peace-art.png" x="76" y="177" width="650" height="880" preserveAspectRatio="xMidYMid slice"/><text x="786" y="242" font-family="Arial" font-size="14" letter-spacing="2" fill="#756b47">THE DAILY FEATURE</text><text x="786" y="325" text-anchor="start" font-family="Georgia" font-size="44" font-weight="400" font-style="italic" fill="#1d201b">“Observe good faith and justice</text><text x="786" y="378.68" text-anchor="start" font-family="Georgia" font-size="44" font-weight="400" font-style="italic" fill="#1d201b">towards all nations; cultivate</text><text x="786" y="432.36" text-anchor="start" font-family="Georgia" font-size="44" font-weight="400" font-style="italic" fill="#1d201b">peace and harmony with all.”</text><text x="786" y="515" font-family="Arial" font-size="19" font-weight="600" fill="#1d201b">George Washington</text><text x="786" y="549" font-family="Arial" font-size="15" fill="#57594f">Farewell Address · 19 September 1796</text><text x="786" y="619" font-family="Arial" font-size="17" fill="#57594f">Washington sets out principles for the young republic’s foreign relations.</text><line x1="786" y1="990" x2="1524" y2="990" stroke="#99968a"/><text x="786" y="1027" font-family="Arial" font-size="13" fill="#756b47">PRIMARY SOURCE</text><text x="786" y="1056" font-family="Arial" font-size="12" fill="#57594f">Yale Avalon · Farewell Address, 1796</text><text x="76" y="1112" font-family="Arial" font-size="12" fill="#57594f">English edition · November 2026 · Campaign artwork shared with the French V1</text></svg>