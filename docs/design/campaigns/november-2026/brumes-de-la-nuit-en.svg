<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200"><rect width="1600" height="1200" fill="#d1d0c5"/><text x="76" y="66" font-family="Georgia" font-size="26" font-style="italic" font-weight="600" fill="#1d201b">verbatims</text><text x="1524" y="64" text-anchor="end" font-family="Arial" font-size="14" fill="#57594f">3–16 November 2026 · priority 1</text><text x="76" y="139" font-family="Georgia" font-size="48" fill="#1d201b">Mists of the Night</text><rect x="76" y="177" width="650" height="880" rx="10" fill="#aaa79a"/><image href="brumes-art.png" x="76" y="177" width="650" height="880" preserveAspectRatio="xMidYMid slice"/><text x="786" y="242" font-family="Arial" font-size="14" letter-spacing="2" fill="#756b47">THE DAILY FEATURE</text><text x="786" y="325" text-anchor="start" font-family="Georgia" font-size="44" font-weight="400" font-style="italic" fill="#1d201b">“It is a beauteous Evening,</text><text x="786" y="378.68" text-anchor="start" font-family="Georgia" font-size="44" font-weight="400" font-style="italic" fill="#1d201b">calm and free;”</text><text x="786" y="461" font-family="Arial" font-size="19" font-weight="600" fill="#1d201b">William Wordsworth</text><text x="786" y="495" font-family="Arial" font-size="15" fill="#57594f">Poems, in Two Volumes, vol. I · 1807</text><text x="786" y="565" font-family="Arial" font-size="17" fill="#57594f">A quiet evening by the sea becomes a reflection on nature’s sacred presence.</text><line x1="786" y1="990" x2="1524" y2="990" stroke="#99968a"/><text x="786" y="1027" font-family="Arial" font-size="13" fill="#756b47">PRIMARY SOURCE</text><text x="786" y="1056" font-family="Arial" font-size="12" fill="#57594f">Wikisource · Poems, in Two Volumes, vol. I, 1807</text><text x="76" y="1112" font-family="Arial" font-size="12" fill="#57594f">English edition · November 2026 · Campaign artwork shared with the French V1</text></svg>