<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200"><rect width="1600" height="1200" fill="#d1d0c5"/><text x="76" y="66" font-family="Georgia" font-size="26" font-style="italic" font-weight="600" fill="#1d201b">verbatims</text><text x="1524" y="64" text-anchor="end" font-family="Arial" font-size="14" fill="#57594f">16 November 2026 · priority 2</text><text x="76" y="139" font-family="Georgia" font-size="48" fill="#1d201b">Tolerance, Many Voices</text><rect x="76" y="177" width="650" height="880" rx="10" fill="#aaa79a"/><image href="voices-art.png" x="76" y="177" width="650" height="880" preserveAspectRatio="xMidYMid slice"/><text x="786" y="242" font-family="Arial" font-size="14" letter-spacing="2" fill="#756b47">THE DAILY FEATURE</text><text x="786" y="325" text-anchor="start" font-family="Georgia" font-size="36" font-weight="400" font-style="italic" fill="#1d201b">“It would, methinks, become all men to</text><text x="786" y="368.92" text-anchor="start" font-family="Georgia" font-size="36" font-weight="400" font-style="italic" fill="#1d201b">maintain peace, and the common offices</text><text x="786" y="412.84000000000003" text-anchor="start" font-family="Georgia" font-size="36" font-weight="400" font-style="italic" fill="#1d201b">of humanity and friendship, in the</text><text x="786" y="456.76" text-anchor="start" font-family="Georgia" font-size="36" font-weight="400" font-style="italic" fill="#1d201b">diversity of opinions”</text><text x="786" y="529" font-family="Arial" font-size="19" font-weight="600" fill="#1d201b">John Locke</text><text x="786" y="563" font-family="Arial" font-size="15" fill="#57594f">An Essay Concerning Humane Understanding · Book IV, Chapter XVI · 1690</text><text x="786" y="633" font-family="Arial" font-size="17" fill="#57594f">Locke urges readers to preserve peace and friendship despite differences of opinion.</text><line x1="786" y1="990" x2="1524" y2="990" stroke="#99968a"/><text x="786" y="1027" font-family="Arial" font-size="13" fill="#756b47">PRIMARY SOURCE</text><text x="786" y="1056" font-family="Arial" font-size="12" fill="#57594f">Wikisource · Book IV, Chapter XVI, 1690</text><text x="76" y="1112" font-family="Arial" font-size="12" fill="#57594f">English edition · November 2026 · Campaign artwork shared with the French V1</text></svg>