<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200"><rect width="1200" height="1200" fill="#f8f7f4"/><defs><clipPath id="art"><rect x="32" y="32" width="1136" height="820" rx="28"/></clipPath></defs><image href="peace-art.png" x="32" y="32" width="1136" height="820" preserveAspectRatio="xMidYMid slice" clip-path="url(#art)"/><text x="600" y="914" text-anchor="middle" font-family="Georgia" font-size="35" font-style="italic" fill="#201d1a">“Observe good faith and justice towards</text><text x="600" y="952.5" text-anchor="middle" font-family="Georgia" font-size="35" font-style="italic" fill="#201d1a">all nations; cultivate peace and</text><text x="600" y="991" text-anchor="middle" font-family="Georgia" font-size="35" font-style="italic" fill="#201d1a">harmony with all.”</text><text x="600" y="1058" text-anchor="middle" font-family="Arial" font-size="24" letter-spacing="1.2" fill="#706c68">George Washington · 11 November 2026</text><text x="600" y="1155" text-anchor="middle" font-family="Arial" font-size="18" letter-spacing="3" fill="#625e5a">verbatims.cc</text></svg>