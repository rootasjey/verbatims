<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quote hero — centered editorial</title>
<style>
:root{color-scheme:light;background:#f7f5ef;color:#191817}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif}main{max-width:1120px;margin:auto;padding:28px 5vw 80px}.mast{display:flex;justify-content:space-between;border-bottom:1px solid #d8d3c8;padding-bottom:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#817b70}.hero{text-align:center;padding:clamp(90px,16vw,190px) 4vw 100px;border-bottom:1px solid #d8d3c8}.kicker{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#9b7a30;margin-bottom:42px}.quote{font-family:Georgia,serif;font-size:clamp(2.5rem,6.5vw,6.4rem);line-height:.98;letter-spacing:-.045em;font-weight:400;max-width:950px;margin:0 auto}.signature{margin:54px auto 0;max-width:420px;font-family:Georgia,serif;font-size:1.25rem}.signature small{display:block;margin-top:10px;font-family:Arial,sans-serif;font-size:12px;color:#817b70;letter-spacing:.04em}.tools{display:flex;justify-content:center;gap:18px;margin-top:34px}.tools button{border:0;background:none;color:#817b70;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.below{display:flex;justify-content:space-between;gap:40px;padding-top:28px;color:#817b70;font-size:12px}.below span{border-bottom:1px solid #bdb7aa;padding-bottom:7px}@media(max-width:600px){main{padding:18px 22px 50px}.hero{padding:95px 0 70px}.quote{font-size:clamp(2.45rem,12vw,4rem)}.below{display:block;line-height:2.5}.below span{margin-right:16px}}
</style>
<body><main><header class="mast"><span>Verbatims</span><span>Quote / 01</span></header><section class="hero"><blockquote class="quote">“The mind is not a vessel to be filled but a fire to be kindled.”</blockquote><div class="signature">Plutarch<small>On listening to lectures</small></div><div class="tools"><button>♡ Save</button><button>↗ Share</button><button>↗ Copy</button></div></section><footer class="below"><span>Philosophy</span><span>English</span><span>Continue reading →</span></footer></main></body>
</html>
